<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable | Nathan Dugal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">

    <style>
        .error{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:120px 8%;
        }
        .error .code{
            font-size:8rem;
            font-weight:700;
            line-height:1;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }
        .error h1{ font-size:2rem; margin:20px 0 10px; }
        .error p{ max-width:480px; line-height:1.7; color:var(--muted); margin-bottom:30px; }
        @media(max-width:900px){
            .error .code{ font-size:5.5rem; }
            .error h1{ font-size:1.5rem; }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo" style="text-decoration:none;color:inherit;">Nathan<span>DUGAL.</span></a>

        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#projects">Projets</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <main class="error">
        <div class="code" aria-hidden="true">404</div>
        <h1>Cette page n'existe pas</h1>
        <p>
            Le lien est peut-être incorrect, ou la page a été déplacée.
            Vous pouvez retourner à l'accueil ou consulter mes projets.
        </p>
        <div class="btns">
            <a href="index.html" class="btn primary">Retour à l'accueil</a>
            <a href="index.html#projects" class="btn secondary">Voir mes projets</a>
        </div>
    </main>

    <footer>© 2026 – Nathan Dugal</footer>

</body>
</html>
